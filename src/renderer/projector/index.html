<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyektor - Salida</title>
  <style>
    /* El proyector siempre es fondo negro absoluto */
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Capa inferior para videos/imágenes */
    #media-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none; /* Oculto por defecto */
    }

    /* Capa superior para texto (canciones, biblias) */
    #text-layer {
      position: absolute;
      z-index: 2;
      width: 90%; /* Margen de seguridad */
      max-height: 90%;
      word-wrap: break-word;
      transition: opacity 0.3s ease-in-out;
      opacity: 0; /* Oculto por defecto */
    }
  </style>
</head>
<body>

  <!-- Capas de contenido -->
  <video id="media-layer" loop muted></video>
  <div id="text-layer"></div>

  <script type="module" src="./main.tsx"></script>
</body>
</html>
